# Deep Value Hunter data proxy.
# Deploy: npx wrangler deploy   (requires: npx wrangler secret put FMP_API_KEY)
name = "dvh-proxy"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# Server-side response cache. Closed fiscal years are immutable, so annual
# fundamentals cache for 30 days; quotes for 60 seconds.
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
